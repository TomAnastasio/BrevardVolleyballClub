<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -10 110 110">
 <defs>
  <radialGradient id="platinum" cx="35%" cy="25%" r="85%">
   <stop offset="0%" stop-color="#ffffff"/>
   <stop offset="35%" stop-color="#e7eaec"/>
   <stop offset="65%" stop-color="#b7bcc1"/>
   <stop offset="100%" stop-color="#787d83"/>
  </radialGradient>
 </defs>
 <style>
  .stink{ transform-box: fill-box; transform-origin: 50% 100%; }
  .stink-1{ animation: stinkWaft1 2s ease-in-out infinite; }
  .stink-2{ animation: stinkWaft2 2.3s ease-in-out infinite; animation-delay: .3s; }
  .stink-3{ animation: stinkWaft3 1.8s ease-in-out infinite; animation-delay: .6s; }
  @keyframes stinkWaft1{
   0%,100%{ transform:translate(0,0) rotate(0deg); opacity:.82; }
   50%{ transform:translate(1.4px,-2.6px) rotate(5deg); opacity:1; }
  }
  @keyframes stinkWaft2{
   0%,100%{ transform:translate(0,0) rotate(0deg); opacity:.82; }
   50%{ transform:translate(-1.4px,-2.6px) rotate(-5deg); opacity:1; }
  }
  @keyframes stinkWaft3{
   0%,100%{ transform:translate(0,0) rotate(0deg); opacity:.82; }
   50%{ transform:translate(1px,-3px) rotate(4deg); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
   .stink-1,.stink-2,.stink-3{ animation: none; }
  }
 </style>
