<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Brevard Volleyball Club</title>
<meta name="description" content="Find pickup volleyball today and track live beach volleyball games — Brevard Volleyball Club.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash" class="splash" aria-hidden="true">
  <svg class="splash-logo" viewBox="0 0 400 160" role="img" aria-label="BVC">
    <text x="70" y="130" text-anchor="middle" class="logo-letter" id="letterB">B</text>
    <text x="200" y="130" text-anchor="middle" class="logo-letter" id="letterV">V</text>
    <text x="330" y="130" text-anchor="middle" class="logo-letter" id="letterC">C</text>
  </svg>
</div>

<div id="appRoot" class="app-root" hidden>

  <main class="view" id="landingView">
    <div class="landing-content">
      <p class="landing-kicker">Brevard Volleyball Club</p>
      <div class="landing-options">
        <button type="button" class="landing-card" id="goPlayToday">
          <span class="landing-icon" aria-hidden="true">📍</span>
          <span class="landing-label">Where to play volleyball today</span>
        </button>
        <button type="button" class="landing-card" id="goGameTracking">
          <span class="landing-icon" aria-hidden="true">🏐</span>
          <span class="landing-label">Game tracking</span>
        </button>
      </div>
    </div>
  </main>

  <main class="view" id="playTodayView" hidden>
    <header class="sub-header">
      <button type="button" class="back-btn" id="backFromPlay" aria-label="Back to menu">&lsaquo; Menu</button>
      <h2 class="view-title">Where to Play Today</h2>
    </header>
    <div class="play-list" id="playList"></div>
  </main>

  <div class="app-shell" id="gameTrackingSection" hidden>

    <header class="app-header">
      <button type="button" class="back-btn" id="backFromGame" aria-label="Back to menu">&lsaquo; Menu</button>
      <div class="app-header-text">
        <h1>Beach Volleyball Scoreboard</h1>
        <p class="subtitle">Brevard Volleyball Club</p>
      </div>
    </header>

    <main class="view" id="gameView">

      <div class="scoreboard">

        <section class="team-panel team-a" aria-labelledby="teamAName">
          <h2 id="teamAName" class="team-name" contenteditable="true" spellcheck="false"
              role="textbox" aria-label="Team A name, tap to edit" tabindex="0">Team A</h2>

          <div class="score-display">
            <span class="score" id="scoreA" aria-live="polite" aria-atomic="true">0</span>
          </div>

          <div class="controls">
            <button type="button" class="btn btn-increase" id="incA" aria-label="Add point to Team A">
              <span aria-hidden="true">+1</span>
            </button>
            <button type="button" class="btn btn-decrease" id="decA" aria-label="Remove point from Team A, fix a mistake">
              <span aria-hidden="true">&minus;1</span>
            </button>
          </div>
        </section>

        <div class="divider" aria-hidden="true">
          <span>VS</span>
        </div>

        <section class="team-panel team-b" aria-labelledby="teamBName">
          <h2 id="teamBName" class="team-name" contenteditable="true" spellcheck="false"
              role="textbox" aria-label="Team B name, tap to edit" tabindex="0">Team B</h2>

          <div class="score-display">
            <span class="score" id="scoreB" aria-live="polite" aria-atomic="true">0</span>
          </div>

          <div class="controls">
            <button type="button" class="btn btn-increase" id="incB" aria-label="Add point to Team B">
              <span aria-hidden="true">+1</span>
            </button>
            <button type="button" class="btn btn-decrease" id="decB" aria-label="Remove point from Team B, fix a mistake">
              <span aria-hidden="true">&minus;1</span>
            </button>
          </div>
        </section>

      </div>

      <div id="winnerBanner" class="winner-banner" role="alert" hidden>
        <p id="winnerText"></p>
        <div class="winner-actions">
          <button type="button" id="saveGameBtn" class="btn btn-save">Save &amp; New Game</button>
          <button type="button" id="keepPlayingBtn" class="btn btn-keep-playing">Keep Playing</button>
        </div>
      </div>

      <div class="game-actions">
        <button type="button" id="resetBtn" class="btn btn-reset" aria-label="Start a new game, resets both scores to zero">
          New Game
        </button>
      </div>

    </main>

    <main class="view" id="historyView" hidden>
      <h2 class="view-title">Game History</h2>
      <ul id="historyList" class="history-list"></ul>
      <p id="historyEmpty" class="history-empty" hidden>No games saved yet. Finish a game to see it here.</p>
    </main>

    <nav class="tab-bar" aria-label="Sections">
      <button type="button" class="tab-btn" id="tabGame" aria-current="page">
        <span aria-hidden="true">🏐</span> Game
      </button>
      <button type="button" class="tab-btn" id="tabHistory">
        <span aria-hidden="true">🕘</span> History
      </button>
    </nav>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
